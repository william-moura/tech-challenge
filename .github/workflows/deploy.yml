name: Deploy Laravel App to K3s

on:
  push:
    branches: [ master ]

# ADICIONE ESTE BLOCO DE PERMISSÕES
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy App on K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}          
          command_timeout: 10m
          script: |
            # 1. Garante a instalação do K3s se necessário
            if ! command -v k3s &> /dev/null; then
              echo "=== Instalando K3s... ==="
              curl -sfL https://get.k3s.io | sh -
              sleep 30
            fi

            # 2. Aguarda a API do K3s responder plenamente
            until sudo k3s kubectl get nodes &> /dev/null; do
              echo "Aguardando API do K3s ficar pronta..."
              sleep 5
            done

            # 3. Cria a Secret do Docker Registry (GHCR)
            sudo k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=william-moura \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --namespace=default --dry-run=client -o yaml | sudo k3s kubectl apply -f -

            # 4. Aplica os manifestos da infraestrutura se o deployment ainda não existir
            if ! sudo k3s kubectl get deployment/tc-app-laravel &> /dev/null; then
              echo "=== Aplicando manifestos base da infraestrutura... ==="
              sudo dnf install -y git
              rm -rf ~/repo-infra && mkdir -p ~/repo-infra
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/william-moura/tc-soat-k8s-infra.git ~/repo-infra
              sudo k3s kubectl apply --validate=false -f ~/repo-infra/k8s-manifests/
              rm -rf ~/repo-infra
              sleep 10
            fi

            # 5. Atualiza a imagem para a versão mais recente e reinicia
            sudo k3s kubectl set image deployment/tc-app-laravel laravel=ghcr.io/william-moura/tech-challenge:master --namespace=default
            sudo k3s kubectl rollout restart deployment/tc-app-laravel

            # 6. Monitora o Rollout do Pod
            if ! sudo k3s kubectl rollout status deployment/tc-app-laravel --timeout=90s; then
              echo "=== DEPLOYMENT FALHOU OU DEMOROU DEMAIS ==="
              echo "--- Status dos Pods ---"
              sudo k3s kubectl get pods
              echo "--- Describe do Pod ---"
              sudo k3s kubectl describe pods -l app=tc-app-laravel
              echo "--- Logs do Container ---"
              sudo k3s kubectl logs -l app=tc-app-laravel --tail=50
              exit 1
            fi

            # 7. Executa as Migrations no Laravel
            POD_NAME=$(sudo k3s kubectl get pods -l app=tc-app-laravel -o jsonpath="{.items[0].metadata.name}")
            if [ -n "$POD_NAME" ]; then
              echo "=== Executando artisan migrate... ==="
              sudo k3s kubectl exec $POD_NAME -c laravel -- php artisan migrate --force
            fi