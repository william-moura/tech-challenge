name: Deploy Laravel App to K3s

on:
  push:
    branches: [ master ]

# ADICIONE ESTE BLOCO DE PERMISSÕES
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy App on K3s via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Atualiza a imagem do container nomeado "laravel"
            sudo k3s kubectl set image deployment/tc-app-laravel laravel=ghcr.io/william-moura/tech-challenge:master --namespace=default || true
            
            # 2. Reinicia o Deployment para baixar a nova imagem
            sudo k3s kubectl rollout restart deployment/tc-app-laravel
            
            # 3. Aguarda o novo Pod ficar pronto antes de rodar as migrations (previne erros)
            sudo k3s kubectl rollout status deployment/tc-app-laravel --timeout=60s
            
            # 4. Executa as migrations dentro do container "laravel"
            POD_NAME=$(sudo k3s kubectl get pods -l app=tc-app-laravel -o jsonpath="{.items[0].metadata.name}" 2>/dev/null)
            if [ -n "$POD_NAME" ]; then
              sudo k3s kubectl exec $POD_NAME -c laravel -- php artisan migrate --force
            fi