name: Deploy Laravel App to K3s

on:
  pull_request:
    branches: [ master ]

# ADICIONE ESTE BLOCO DE PERMISSÕES
permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags/Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: SSH Deploy and Rollout on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 10m
          command_timeout: 10m
          script: |
            set -e

            # 1. Garante a instalação do K3s se não existir
            if ! command -v k3s &> /dev/null; then
              echo "=== Instalando K3s... ==="
              curl -sfL https://get.k3s.io | sh -
              sudo systemctl enable --now k3s
              sleep 15
            fi

            # 2. Garante que o serviço do K3s esteja ATIVO
            echo "=== Verificando serviço systemctl do K3s... ==="
            if ! sudo systemctl is-active --quiet k3s; then
              echo "WARNING: Serviço K3s inativo! Tentando reiniciar..."
              sudo systemctl restart k3s
              sleep 10
            fi

            # Configura permissão do kubeconfig
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # 3. Teste do kubectl com TIMEOUT de 15 segundos para evitar travamento infinito
            echo "=== Testando conexão com K3s... ==="
            if ! sudo /usr/local/bin/k3s kubectl get nodes --request-timeout='15s'; then
              echo "ERROR: API Server do K3s não respondeu em 15s!"
              echo "--- Últimos logs do serviço K3s ---"
              sudo journalctl -u k3s -n 50 --no-pager
              exit 1
            fi

            # 4. Criar Secret do GHCR
            sudo /usr/local/bin/k3s kubectl create secret docker-registry ghcr-secret \
              --docker-server=ghcr.io \
              --docker-username=${{ github.actor }} \
              --docker-password=${{ secrets.GITHUB_TOKEN }} \
              --namespace=default --dry-run=client -o yaml | sudo /usr/local/bin/k3s kubectl apply -f -

            # 5. Aplicar manifestos se necessário
            if ! sudo /usr/local/bin/k3s kubectl get deployment/tc-app-laravel &> /dev/null; then
              echo "=== Aplicando manifestos base da infraestrutura... ==="
              sudo dnf install -y git
              rm -rf ~/repo-infra && mkdir -p ~/repo-infra
              git clone https://github.com/william-moura/tc-soat-k8s-infra.git ~/repo-infra
              sudo /usr/local/bin/k3s kubectl apply -f ~/repo-infra/k8s-manifests/
              rm -rf ~/repo-infra
              sleep 5
            fi

            # 6. Atualização da Imagem e Rollout
            sudo /usr/local/bin/k3s kubectl set image deployment/tc-app-laravel laravel=ghcr.io/${{ github.repository_owner }}/tech-challenge:master --namespace=default
            sudo /usr/local/bin/k3s kubectl rollout restart deployment/tc-app-laravel

            # 7. Aguardar Rollout
            sudo /usr/local/bin/k3s kubectl rollout status deployment/tc-app-laravel --timeout=60s

            # 8. Executar Migrations
            POD_NAME=$(sudo /usr/local/bin/k3s kubectl get pods -l app=tc-app-laravel -o jsonpath="{.items[0].metadata.name}")
            if [ -n "$POD_NAME" ]; then
              echo "=== Executando artisan migrate... ==="
              sudo /usr/local/bin/k3s kubectl exec $POD_NAME -c laravel -- php artisan migrate --force
            fi