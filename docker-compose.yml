version: '3.8'

networks:
  techchallenge-net:
    driver: bridge

services:
  # 1. Banco de Dados Gerenciado Simulado (MySQL / PostgreSQL)
  database:
    image: mysql:8.0
    container_name: tc-db-local
    restart: always
    environment:
      # POSTGRES_DB: techchallenge
      # POSTGRES_USER: dbadmin
      # POSTGRES_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: techchallenge
      MYSQL_USER: dbadmin
      MYSQL_PASSWORD: secretpassword
    ports:
      - "3308:3306"
    networks:
      - techchallenge-net

  # 2. Aplicação Principal Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tc-app-laravel
    restart: always
    ports:
      - "8000:80"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: techchallenge
      DB_USERNAME: dbadmin
      DB_PASSWORD: secretpassword
      JWT_SECRET: Iv42lYOWsLbs8NCYj9gLQfOBicN/VCIKgyb7ZrAsjD4=
    depends_on:
      - database
    networks:
      - techchallenge-net

  # 3. Lambda Auth (Rodando como serviço HTTP local)
  auth-lambda:
    build:
      context: ../tc-soat-auth-lambda # Caminho para a pasta da sua Lambda
      dockerfile: Dockerfile.local # Dockerfile simplificado para rodar a Lambda como servidor Express local
    container_name: tc-auth-lambda
    ports:
      - "3000:3000"
    environment:
      DB_HOST: database           # <--- DEVE SER O NOME DO SERVIÇO DO BANCO
      DB_PORT: 3306              # ou 5432 se for Postgres
      DB_USER: dbadmin           # mesmo usuário definido no serviço 'database'
      DB_PASSWORD: secretpassword # mesma senha definida no serviço 'database'
      DB_NAME: techchallenge     # mesmo nome do banco
      JWT_SECRET: Iv42lYOWsLbs8NCYj9gLQfOBicN/VCIKgyb7ZrAsjD4=
    depends_on:
      - database
    networks:
      - techchallenge-net
  api-gateway:
    image: nginx:alpine
    container_name: tc-api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - auth-lambda
    networks:
      - techchallenge-net
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - 8082:8080
    environment:
      SWAGGER_JSON: /app/openapi.yaml
    volumes:
      - ./openapi.yaml:/app/openapi.yaml
    networks:
      - techchallenge-net

  sonar:
    image: sonarqube:latest
    ports:
      - 9000:9000
    networks:
      - techchallenge-net

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    environment:
      SONAR_HOST_URL: http://sonar:9000
      SONAR_TOKEN: ${SONAR_TOKEN}
    depends_on:
      - sonar
    networks:
      - techchallenge-net

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    profiles: [zap]
    depends_on:
      app-php:
        condition: service_healthy
    volumes:
      - ./openapi.yaml:/zap/wrk/openapi.yaml:ro
      - ./zap/reports:/zap/wrk/reports
      - ./zap/entrypoint.sh:/zap/wrk/entrypoint.sh:ro
    networks:
      - techchallenge-net
    environment:
      - ZAP_EMAIL
      - ZAP_PASSWORD
    entrypoint: ["bash", "/zap/wrk/entrypoint.sh"]
